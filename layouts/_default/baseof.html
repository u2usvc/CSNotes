<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ partial "h1-title-text.html" . }} - {{ end }}{{ site.Title }}</title>
  {{ $favicon := partial "logo.html" "#c8c8c8" | printf `<svg viewBox="0 0 532 532" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">%s</svg>` | resources.FromString "favicon.svg" }}
  <link rel="icon" type="image/svg+xml" href="{{ $favicon.RelPermalink }}">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/syntax.css">
  <link rel="stylesheet" href="/pagefind/pagefind-ui.css">
</head>
<body{{ if .IsHome }} class="home-page"{{ else if eq .Section "notes" }} class="notes-page"{{ end }}>
  {{ if not .IsHome }}
  <header>
    <a href="/" class="site-title">
      <svg class="site-logo" viewBox="0 0 532 532" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
        {{ partial "logo.html" "currentColor" }}
      </svg>
      {{ site.Title }}
    </a>
    <nav>
      {{ partial "nav-links.html" . }}
      <button id="search-toggle" class="search-toggle" aria-label="Search">
        <span>Search</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </nav>
  </header>
  {{ end }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <dialog id="search-modal">
    <div id="search"></div>
  </dialog>
  <dialog id="lightbox">
    <div class="zoom-frame"><img src="" alt=""></div>
  </dialog>
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    const modal = document.getElementById('search-modal');
    const toggle = document.getElementById('search-toggle');
    let initialized = false;

    if (toggle) {
      toggle.addEventListener('click', () => {
        if (!initialized && typeof PagefindUI !== 'undefined') {
          new PagefindUI({ element: '#search', showImages: false });
          initialized = true;
        }
        modal.showModal();
        requestAnimationFrame(() => modal.querySelector('input')?.focus());
      });

      modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });

      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          toggle.click();
        }
      });
    }
  </script>
  <script>
    const lightbox = document.getElementById('lightbox');
    const zoomFrame = lightbox.querySelector('.zoom-frame');
    const lightboxImg = lightbox.querySelector('img');
    let zoomed = false;

    function panTo(e) {
      const frame = zoomFrame.getBoundingClientRect();
      const x = (e.clientX - frame.left) / frame.width * 100;
      const y = (e.clientY - frame.top) / frame.height * 100;
      lightboxImg.style.transformOrigin = `${x}% ${y}%`;
    }

    function setZoom(on, e) {
      zoomed = on;
      lightbox.classList.toggle('zoomed', on);
      if (on) panTo(e); else lightboxImg.style.transformOrigin = '';
    }

    document.querySelector('main').addEventListener('click', e => {
      if (e.target.tagName !== 'IMG' || e.target.closest('a')) return;
      lightboxImg.src = e.target.currentSrc || e.target.src;
      lightboxImg.alt = e.target.alt;
      lightbox.showModal();
    });

    lightboxImg.addEventListener('click', e => {
      e.stopPropagation();
      setZoom(!zoomed, e);
    });

    zoomFrame.addEventListener('mousemove', e => { if (zoomed) panTo(e); });

    lightbox.addEventListener('click', () => lightbox.close());

    lightbox.addEventListener('close', () => {
      setZoom(false);
      lightboxImg.src = '';
    });
  </script>
  <script>
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebar = document.querySelector('.notes-sidebar');

    if (sidebarToggle && sidebar) {
      const overlay = document.createElement('div');
      overlay.id = 'sidebar-overlay';
      document.body.appendChild(overlay);

      function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('visible');
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('visible');
      }

      sidebarToggle.addEventListener('click', () => {
        sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
      });

      overlay.addEventListener('click', closeSidebar);
    }
  </script>
  <footer>
    <div class="contact-links">
      {{ partial "contact-links.html" . }}
    </div>
  </footer>
</body>
</html>
